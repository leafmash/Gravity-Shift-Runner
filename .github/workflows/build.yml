name: Build Android

on:
  push:
    paths:
      - "drop/*.zip"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3.0"
  NDK_VERSION: "23.2.8568313"
  LOG_DIR: ${{ github.workspace }}/logs

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare log folder
        run: mkdir -p "$LOG_DIR"

      - name: Select dropped zip
        run: |
          ZIP=$(git log -1 --name-only --format= --diff-filter=AM -- 'drop/*.zip' | head -n1)
          if [ -z "$ZIP" ]; then ZIP=$(ls -t drop/*.zip 2>/dev/null | head -n1); fi
          if [ -z "$ZIP" ]; then echo "::error title=No zip::No zip file found inside the drop folder"; exit 1; fi
          echo "Using $ZIP"
          echo "DROP_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          rm -rf work
          mkdir -p work
          unzip -q "$DROP_ZIP" -d work
          PROJECT_FILE=$(find work -name project.godot -not -path "*/__MACOSX/*" -not -path "*/.godot/*" | head -n1)
          if [ -z "$PROJECT_FILE" ]; then echo "::error title=Bad zip::project.godot was not found inside $DROP_ZIP"; exit 1; fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then cp ci/export_presets.cfg "$PROJECT_DIR/export_presets.cfg"; fi
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" "$PROJECT_DIR/export_presets.cfg"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | sort -r | head -n1)
          if [ -z "$SDKMANAGER" ]; then echo "::error title=Android SDK::sdkmanager not found in $SDK_DIR"; exit 1; fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" "cmake;3.10.2.4988404" 2>&1 | tee "$LOG_DIR/sdk-install.log"

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Configure Godot for Android
        run: |
          godot --version
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"${SDK_DIR}\""
            echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
          } > "$HOME/.config/godot/editor_settings-4.tres"
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Prepare keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          DEBUG_KEYSTORE="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -keystore "$DEBUG_KEYSTORE" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$DEBUG_KEYSTORE"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$RELEASE_KEY_ALIAS"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$RELEASE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release builds will use the keystore from secrets"
          else
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$DEBUG_KEYSTORE"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android"
            } >> "$GITHUB_ENV"
            echo "Release secrets missing: release builds will be signed with the debug keystore"
          fi

      - name: Import project
        run: |
          cd "$PROJECT_DIR"
          godot --headless --import 2>&1 | tee "$LOG_DIR/import-1.log" || true
          godot --headless --import 2>&1 | tee "$LOG_DIR/import-2.log" || true

      - name: Install Android build template
        run: |
          cd "$PROJECT_DIR"
          TEMPLATE_ZIP=$(find "$HOME/.local/share/godot" -name android_source.zip | head -n1)
          if [ -z "$TEMPLATE_ZIP" ]; then echo "::error title=Export templates::android_source.zip not found, Godot export templates are missing"; exit 1; fi
          mkdir -p android/build
          unzip -q -o "$TEMPLATE_ZIP" -d android/build
          basename "$(dirname "$TEMPLATE_ZIP")" > android/.build_version
          touch android/build/.gdignore

      - name: Export debug APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "$PROJECT_DIR"
          godot --headless --export-debug "Android APK" "$GITHUB_WORKSPACE/out/GravityShiftRunner-debug.apk" 2>&1 | tee "$LOG_DIR/export-debug-apk.log"
          test -f "$GITHUB_WORKSPACE/out/GravityShiftRunner-debug.apk"

      - name: Export release APK
        run: |
          cd "$PROJECT_DIR"
          godot --headless --export-release "Android APK" "$GITHUB_WORKSPACE/out/GravityShiftRunner-release.apk" 2>&1 | tee "$LOG_DIR/export-release-apk.log"
          test -f "$GITHUB_WORKSPACE/out/GravityShiftRunner-release.apk"

      - name: Export release AAB
        run: |
          cd "$PROJECT_DIR"
          godot --headless --export-release "Android AAB" "$GITHUB_WORKSPACE/out/GravityShiftRunner-release.aab" 2>&1 | tee "$LOG_DIR/export-release-aab.log"
          test -f "$GITHUB_WORKSPACE/out/GravityShiftRunner-release.aab"

      - name: Show main error
        if: failure()
        run: |
          shopt -s nullglob
          echo "## Build failed" >> "$GITHUB_STEP_SUMMARY"
          FOUND=0
          for LOG in "$LOG_DIR"/*.log; do
            NAME=$(basename "$LOG")
            MATCHES=$(grep -n -A1 -E "SCRIPT ERROR|Parse Error|ERROR:|FAILURE:|What went wrong|error:|Exception|No such file|not found" "$LOG" | head -n 16 || true)
            if [ -n "$MATCHES" ]; then
              FOUND=1
              echo "### $NAME" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$MATCHES" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              MESSAGE=$(echo "$MATCHES" | head -n 8 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=Main error in $NAME::$MESSAGE"
              echo "===== $NAME ====="
              echo "$MATCHES"
            fi
          done
          if [ "$FOUND" = "0" ]; then
            echo "::error title=Build failed::Open the red step above to read its log"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gravity-shift-runner-android
          path: out/*
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/*
          if-no-files-found: ignore
